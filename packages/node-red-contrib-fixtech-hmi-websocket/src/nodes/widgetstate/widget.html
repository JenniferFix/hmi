<script type="text/javascript">
  RED.nodes.registerType("widgetstate", {
    category: "hmi",
    color: "#a6bbcf",
    defaults: {
      name: { value: "" },
    },
    inputs: 1,
    outputs: 1,
    icon: "file.svg",
    label: function () {
      return this.name || "widgetstate";
    },
  });
</script>

<script type="text/html" data-template-name="widgetstate">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
</script>

<script type="text/html" data-help-name="widgetstate">
  <p>
    Goal is to set the properties of the selected widget programmaticlly through
    node-red
  </p>
</script>
